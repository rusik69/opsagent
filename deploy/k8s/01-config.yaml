apiVersion: v1
kind: ConfigMap
metadata:
  name: opsagent-config
  namespace: opsagent
data:
  config.yaml: |
    server:
      listen: ":8080"
    storage:
      path: "/data/opsagent.db"
      retention_days: 0
    ssh:
      timeout_seconds: 10
      use_agent: false
      private_key: "/etc/ssh-keys/demo_key"
      known_hosts: "insecure"
      hosts:
        - name: web-01
          address: demo-web
          user: ops
          port: 22
        - name: db-01
          address: demo-db
          user: ops
          port: 22
    allowlist:
      commands:
        - id: nginx_conf_test
          description: "nginx configuration syntax check (read-only)"
          template: "nginx -t"
    repos:
      - {name: ansible, type: ansible, path: /repos/ansible}
      - {name: puppet, type: puppet, path: /repos/puppet}
      - {name: docs, type: docs, path: /repos/docs}
    llm:
      enabled: true
      base_url: "http://mockllm:8081/v1"
      api_key: ""
      model: "demo"
      max_steps: 12
      timeout_secs: 90
    gitlab:
      base_url: "http://gitlab"
      token: "demo-token"
      default_project_id: "acme/infra"
      source_branch_prefix: "opsagent-fix"
      target_branch: "main"
      poll_mr_seconds: 10
    agent:
      instructions_file: "/app/agent-rules.md"
      max_concurrent: 2
    correlate:
      enabled: true
      window_minutes: 60
      interval_minutes: 5
    review:
      enabled: false
    mcp:
      expose_http: true
---
# Demo config repos (ansible/puppet/docs) mounted under /repos. These define the
# EXPECTED state; the demo hosts deliberately contradict it so the agent finds
# a real root cause by comparing observed state against config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-repos
  namespace: opsagent
data:
  "ansible/hosts.ini": |
    [webservers]
    web-01 ansible_host=10.0.0.10

    [databases]
    db-01 ansible_host=10.0.0.20
  "ansible/host_vars/web-01.yml": |
    ---
    nginx_port: 8080
    worker_processes: 4
    mem_limit: 4g
    role: web
  "ansible/host_vars/db-01.yml": |
    ---
    postgres_version: 15
    max_connections: 200
    shared_buffers: 256MB
    shared_memory_type: mmap
    role: database
  "ansible/roles/nginx/templates/nginx.conf.j2": |
    worker_processes {{ worker_processes }};

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        server {
            listen {{ nginx_port }};
            server_name {{ inventory_hostname }}.example.com;
            root /var/www/html;
        }
    }
  "ansible/roles/postgres/templates/postgresql.conf": |
    max_connections = {{ max_connections }}
    shared_buffers = {{ shared_buffers }}
    shared_memory_type = {{ shared_memory_type }}
  "puppet/nodes/web-01.pp": |
    node 'web-01' {
      include ::nginx
      class { 'nginx::server':
        port => 8080,
      }
      package { 'curl':
        ensure => installed,
      }
    }
  "puppet/nodes/db-01.pp": |
    node 'db-01' {
      class { 'postgresql::server':
        version          => '15',
        max_connections  => 200,
        shared_buffers   => '256MB',
        shared_memory_type => 'mmap',
      }
    }
  "puppet/hieradata/web-01.yaml": |
    ---
    nginx::server::port: 8080
    nginx::server::worker_processes: 4
    nginx::server::client_max_body_size: 32m
  "docs/nginx-troubleshooting.md": |
    # Nginx troubleshooting

    When nginx returns 502/504 or high load is reported:

    1. Check /var/log/nginx/error.log first.
    2. Verify the backend is reachable: `ss -tulpn` on the host.
    3. Run `nginx -t`; a failed config test means a directive is wrong
       (often in a file under /etc/nginx/conf.d/).
    4. Compare the running config with the ansible template
       `roles/nginx/templates/nginx.conf.j2`; worker_processes should match
       the CPU count.
    5. Remove the offending directive, re-run `nginx -t`, then reload.
  "docs/postgres-tuning.md": |
    # Postgres tuning

    Connection pool exhaustion and startup failures are the most common issues:

    1. Check `/var/log/postgresql/postgresql.log` for FATAL lines.
    2. `FATAL: could not create shared memory segment` means the kernel
       shared memory settings are too small for `shared_buffers`.
    3. Raise `shared_buffers` or switch `shared_memory_type` to `mmap`.
    4. Verify `free -h` and `/dev/shm` sizing before restarting postgres.